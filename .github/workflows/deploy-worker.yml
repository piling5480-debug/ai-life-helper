name: 部署到 Cloudflare（選用，repo 設私人時使用）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: 未設定 Cloudflare，略過（使用 GitHub Pages 即可）
        if: env.HAS_CF != 'true'
        run: echo "未設定 CLOUDFLARE_API_TOKEN，略過 Cloudflare 部署"
      - name: 部署靜態網站到 Cloudflare
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
